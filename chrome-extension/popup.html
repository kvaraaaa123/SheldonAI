<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheldonAI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      min-height: 180px;
      background: #FAFAF8;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .wordmark {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a0a12;
      text-align: center;
      line-height: 1;
    }

    .wordmark span {
      color: #9a7040;
    }

    .tagline {
      font-size: 12px;
      color: rgba(10, 10, 18, 0.45);
      text-align: center;
      margin-top: -12px;
    }

    #analyzeBtn {
      width: 100%;
      padding: 13px;
      background: #9a7040;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #analyzeBtn:hover:not(:disabled) {
      opacity: 0.88;
    }

    #analyzeBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 13px;
      color: rgba(10, 10, 18, 0.55);
      text-align: center;
      line-height: 1.5;
      min-height: 18px;
      width: 100%;
    }

    #status.error {
      color: #dc2626;
    }

    #status.success {
      color: #16a34a;
      font-weight: 600;
    }

    .divider {
      width: 100%;
      height: 0.5px;
      background: rgba(10, 10, 18, 0.09);
    }
  </style>
</head>
<body>
  <div class="wordmark">Sheldon<span>AI</span></div>
  <p class="tagline">Sentence-level essay annotation</p>

  <div class="divider"></div>

  <button id="analyzeBtn">Analyze Essay</button>
  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
